<div class="page-header">
  <h2>{{ isEdit ? 'Editar Doctor' : 'Nuevo Doctor' }}</h2>
  <a routerLink="/doctors" class="btn btn-outline">Volver</a>
</div>

<form #f="ngForm" (ngSubmit)="save()" class="form-card">
  <div class="form-row">
    <label>Nombre
      <input [(ngModel)]="doctor.name" name="name" required placeholder="Ej. María" />
    </label>
    <label>Apellidos
      <input [(ngModel)]="doctor.lastName" name="lastName" required placeholder="Ej. García López" />
    </label>
  </div>
  <div class="form-row">
    <label>Teléfono
      <input [(ngModel)]="doctor.phone" name="phone" required placeholder="+34 600 123 456" />
    </label>
    <label>Especialidad
      <select [(ngModel)]="doctor.specialty" name="specialty" required>
        <option value="" disabled>Seleccionar especialidad</option>
        @for (spec of specialties; track spec.value) {
          <option [value]="spec.value">{{ spec.label }}</option>
        }
      </select>
    </label>
  </div>

  @if (error) {
    <span class="error-message">{{ error }}</span>
  }

  <div class="form-actions">
    <button type="button" class="btn btn-outline" (click)="cancel()">Cancelar</button>
    <button type="submit" class="btn" [disabled]="f.invalid">{{ isEdit ? 'Guardar cambios' : 'Guardar doctor' }}</button>
  </div>
</form>
