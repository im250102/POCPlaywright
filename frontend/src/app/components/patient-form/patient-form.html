<div class="page-header">
  <h2>Nuevo Paciente</h2>
  <a routerLink="/patients" class="btn btn-outline">Volver</a>
</div>

<form #f="ngForm" (ngSubmit)="save()" class="form-card">
  <div class="form-row">
    <label>Nombre completo
      <input [(ngModel)]="patient.name" name="name" required placeholder="Ej. María García López" />
    </label>
    <label>Email
      <input [(ngModel)]="patient.email" name="email" type="email" required placeholder="paciente@correo.com" />
    </label>
  </div>
  <div class="form-row">
    <label>Teléfono
      <input [(ngModel)]="patient.phone" name="phone" required placeholder="+52 55 1234 5678" />
    </label>
    <label>Fecha de nacimiento
      <input [(ngModel)]="patient.dateOfBirth" name="dateOfBirth" type="date" />
    </label>
  </div>
  <label>Dirección
    <input [(ngModel)]="patient.address" name="address" placeholder="Calle y número, colonia, ciudad" />
  </label>
  <div class="form-actions">
    <button type="submit" class="btn" [disabled]="f.invalid">Guardar paciente</button>
  </div>
</form>
