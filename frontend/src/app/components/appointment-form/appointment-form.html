<div class="page-header">
  <h2>Nueva Cita</h2>
  <a routerLink="/appointments" class="btn btn-outline">Volver</a>
</div>

<form #f="ngForm" (ngSubmit)="save()" class="form-card">
  <label>Paciente
    <select [(ngModel)]="appointment.patientId" name="patientId" (change)="onPatientChange()" required>
      <option value="">Seleccionar paciente...</option>
      <option *ngFor="let p of patients" [value]="p.id">{{ p.name }}</option>
    </select>
  </label>
  <label>Fecha y hora
    <input [(ngModel)]="appointment.date" name="date" type="datetime-local" required />
  </label>
  <label>Motivo de la consulta
    <textarea [(ngModel)]="appointment.reason" name="reason" required placeholder="Describe el motivo de la visita"></textarea>
  </label>
  <div class="form-actions">
    <button type="submit" class="btn" [disabled]="f.invalid">Crear cita</button>
  </div>
</form>
