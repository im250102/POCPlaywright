<div class="page-header">
  <h2>Citas Médicas</h2>
  <div class="header-actions">
    <button class="btn btn-outline" (click)="exportPdf()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Exportar PDF
    </button>
    <a routerLink="/appointments/calendar" class="btn btn-outline">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Calendario
    </a>
    <a routerLink="/appointments/new" class="btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nueva Cita
    </a>
  </div>
</div>

<table>
  <thead>
    <tr><th>Paciente</th><th>Fecha</th><th>Motivo</th><th>Estado</th><th></th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let a of appointments">
      <td><strong>{{ a.patientName }}</strong></td>
      <td>{{ a.date | date:'dd/MM/yyyy HH:mm' }}</td>
      <td>{{ a.reason }}</td>
      <td><span class="status" [class.status-scheduled]="a.status === 'Scheduled'">{{ a.status }}</span></td>
      <td class="actions">
        <button class="btn btn-danger" (click)="deleteAppointment(a.id!)">Cancelar</button>
      </td>
    </tr>
    <tr *ngIf="appointments.length === 0">
      <td colspan="5" class="empty">No hay citas programadas</td>
    </tr>
  </tbody>
</table>
