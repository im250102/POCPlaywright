<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 2v20M2 12h20"/>
        </svg>
      </div>
      <h1>Crear Cuenta</h1>
      <p class="auth-sub">Regístrate para gestionar tus citas médicas</p>
    </div>

    @if (error) {
      <div class="auth-error">{{ error }}</div>
    }

    <form #form="ngForm" (ngSubmit)="register()" class="auth-form">
      <label>
        Nombre Completo
        <input type="text" name="name" [(ngModel)]="name" required />
      </label>
      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email" required email />
      </label>
      <label>
        Contraseña
        <input type="password" name="password" [(ngModel)]="password" required minlength="8" />
      </label>
      <label>
        Confirmar Contraseña
        <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required />
      </label>
      <button type="submit" class="btn" [disabled]="form.invalid">Crear Cuenta</button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
