services:
  - type: web
    name: pocplaywright-backend
    runtime: docker
    repo: https://github.com/im250102/POCPlaywright
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__MongoDb
        sync: false
      - key: DatabaseName
        value: POCPlaywright
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: POCPlaywright
      - key: Jwt__Audience
        value: POCPlaywright
      - key: Jwt__TokenExpiryMinutes
        value: 60
      - key: Notifications__Provider
        value: telegram
      - key: Notifications__TelegramBotToken
        sync: false
      - key: Notifications__TelegramChatId
        sync: false
